services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?crie o arquivo .env (cp .env.example .env)}
      POSTGRES_USER: ${POSTGRES_USER:?crie o arquivo .env (cp .env.example .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?crie o arquivo .env (cp .env.example .env)}
    volumes:
      - pgdata:/var/lib/postgresql/data  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?crie o arquivo .env (cp .env.example .env)}
      SESSION_SECRET: ${SESSION_SECRET:?crie o arquivo .env (cp .env.example .env)}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy 
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
